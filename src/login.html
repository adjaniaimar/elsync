<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-card">
    <div class="login-title">ELSYNC</div>
    <div class="login-sub">Enter your email and password to log in.</div>

    <div class="login-error" id="loginError">Username and password are required.</div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <div class="field-input">
          <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="field-input">
          <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <span id="loginBtnText">Login</span>
        <span class="arrow">&rarr;</span>
      </button>
    </form>
  </div>

  <script src="login.js"></script>
</body>
</html>
