<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elsync</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <nav class="nav">
      <button class="nav-item active" data-metric="all" data-label="DASHBOARD" aria-label="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
      </button>
      <button class="nav-item" data-metric="arus" data-label="ARUS" aria-label="Arus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
      </button>
      <button class="nav-item" data-metric="frekuensi" data-label="FREKUENSI" aria-label="Frekuensi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c1.7-4 3.3-6 5-6s3.3 2 5 6 3.3 6 5 6 3.3-2 5-6"/></svg>
      </button>
      <button class="nav-item" data-metric="kwh" data-label="KWH" aria-label="kWh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14l4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
      </button>
      <button class="nav-item" data-metric="daya" data-label="DAYA" aria-label="Daya">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </button>
      <button class="nav-item" data-metric="tegangan" data-label="TEGANGAN" aria-label="Tegangan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg>
      </button>
    </nav>
    <button class="logout-btn" data-label="LOGOUT" aria-label="Logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </aside>

  <header class="mobile-topbar">
    <span class="mobile-topbar-brand">ELSYNC</span>
    <button class="logout-btn mobile-logout-btn" aria-label="Logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </header>

  <main class="content">
    <h1 class="page-title">DASHBOARD</h1>

    <section class="card-row">
      <div class="metric-card" data-metric="arus">
        <div class="metric-label">ARUS</div>
        <div class="metric-value"><span id="val-arus">--</span><span class="metric-unit">A</span></div>
        <div class="metric-sub"><span>R <b data-key="arus_r">--</b></span><span>S <b data-key="arus_s">--</b></span><span>T <b data-key="arus_t">--</b></span></div>
      </div>
      <div class="metric-card" data-metric="frekuensi">
        <div class="metric-label">FREKUENSI</div>
        <div class="metric-value"><span id="val-frekuensi">--</span><span class="metric-unit">Hz</span></div>
        <div class="metric-sub"><span>PF <b data-key="pf">--</b></span></div>
      </div>
      <div class="metric-card" data-metric="kwh">
        <div class="metric-label">KWH</div>
        <div class="metric-value"><span id="val-kwh">--</span><span class="metric-unit">kWh</span></div>
      </div>
      <div class="metric-card" data-metric="daya">
        <div class="metric-label">DAYA</div>
        <div class="metric-value"><span id="val-daya">--</span><span class="metric-unit">W</span></div>
        <div class="metric-sub"><span>R <b data-key="daya_r">--</b></span><span>S <b data-key="daya_s">--</b></span><span>T <b data-key="daya_t">--</b></span></div>
      </div>
      <div class="metric-card" data-metric="tegangan">
        <div class="metric-label">TEGANGAN</div>
        <div class="metric-value"><span id="val-tegangan">--</span><span class="metric-unit">V</span></div>
        <div class="metric-sub"><span>R <b data-key="tegangan_r">--</b></span><span>S <b data-key="tegangan_s">--</b></span><span>T <b data-key="tegangan_t">--</b></span><span hidden>R-S <b data-key="tegangan_rs">--</b></span><span hidden>S-T <b data-key="tegangan_st">--</b></span><span hidden>T-R <b data-key="tegangan_tr">--</b></span></div>
      </div>
    </section>

    <h2 class="section-title">REAL TIME DATA</h2>
    <section class="chart-panel">
      <div style="position:relative">
        <svg id="realtimeChart" viewBox="0 0 1000 260" preserveAspectRatio="none"></svg>
        <div id="disconnectedOverlay" class="disconnected-overlay">Disconnected</div>
        <div class="chart-tooltip" id="chartTooltip"></div>
        <svg id="chartHitlayer" class="chart-hitlayer" viewBox="0 0 1000 260" preserveAspectRatio="none">
          <rect x="0" y="0" width="1000" height="260" fill="transparent"/>
        </svg>
      </div>
      <div class="chart-timestamps" id="chartTimestamps"></div>
      <div class="chart-legend" id="chartLegend"></div>
    </section>

    <div class="section-title-row">
  <h2 class="section-title">LOG POLLING</h2>
  <div class="export-control" id="exportControl">
    <button class="export-btn" id="exportBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
      EXPORT
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="export-menu" id="exportMenu">
      <button class="export-option" data-format="json"><span class="badge json">JSON</span> Export as JSON</button>
      <button class="export-option" data-format="csv"><span class="badge csv">CSV</span> Export as CSV</button>
      <button class="export-option" data-format="xlsx"><span class="badge xlsx">XLS</span> Export as Excel</button>
      <button class="export-option" data-format="pdf"><span class="badge pdf">PDF</span> Export as PDF</button>
    </div>
  </div>
</div>
    <section class="log-panel">
      <table class="log-table">
        <thead>
          <tr>
            <th>TIMESTAMP</th>
            <th>ARUS</th>
            <th>FREKUENSI</th>
            <th>KWH</th>
            <th>DAYA</th>
            <th>TEGANGAN</th>
          </tr>
        </thead>
        <tbody id="logBody">
        </tbody>
      </table>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-metric="all">DASHBOARD</button>
    <button class="nav-item" data-metric="arus">ARUS</button>
    <button class="nav-item" data-metric="frekuensi">FREKUENSI</button>
    <button class="nav-item" data-metric="kwh">KWH</button>
    <button class="nav-item" data-metric="daya">DAYA</button>
    <button class="nav-item" data-metric="tegangan">TEGANGAN</button>
  </nav>

 <!-- FOOTER -->
  <footer class="page-footer">
    <span>Made with art by&nbsp;</span><strong>Nevillaz</strong>
  </footer>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
